name: Update README Taxonomy Tree

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'taxonomy-tree.json'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Taxonomy Tree in README
        run: node .github/scripts/update-readme.cjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "docs: auto-update taxonomy tree in README" && git push)
