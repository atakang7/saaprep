<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a70" />
      <stop offset="100%" stop-color="#ff5f56" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGlow)" />

  <!-- Shield Logo / Icon Graphic -->
  <g transform="translate(100, 130)">
    <!-- Base Shield Outline -->
    <path d="M 0 0 L 60 0 L 60 65 L 30 95 L 0 65 Z" fill="rgba(255,42,112,0.08)"/>
    <path d="M 0 0 L 60 0 L 60 65 L 30 95 L 0 65 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="3" filter="url(#glow)"/>
    <!-- Inner Accent -->
    <path d="M 30 25 L 42 35 L 30 65 L 18 35 Z" fill="#ff2a70" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <g font-family="Inter, -apple-system, sans-serif">
    <!-- Eyebrow -->
    <text x="195" y="185" fill="#8b95ad" font-size="24" font-weight="700" letter-spacing="4">TACTICAL EXAM DRILL</text>
    
    <!-- Title -->
    <text x="96" y="310" fill="#ffffff" font-size="88" font-weight="900" letter-spacing="-2.5">SAA-C03 Prep</text>
    
    <!-- Subtitle -->
    <text x="100" y="380" fill="#d7deea" font-size="34" font-weight="600" opacity="0.85">AWS Certified Solutions Architect – Associate</text>
    
    <!-- Features -->
    <g transform="translate(100, 480)" font-size="24" font-weight="600" fill="#a4b1cd">
      <!-- Item 1 -->
      <circle cx="0" cy="-7" r="6" fill="#ff2a70" opacity="0.9"/>
      <text x="24" y="0">1,000+ Scenario Questions</text>
      
      <!-- Item 2 -->
      <circle cx="390" cy="-7" r="6" fill="#00e5ff" opacity="0.9"/>
      <text x="414" y="0">Fact-Checked Routing Guides</text>
      
      <!-- Item 3 -->
      <circle cx="800" cy="-7" r="6" fill="#10b981" opacity="0.9"/>
      <text x="824" y="0">Architecture Taxonomy</text>
    </g>
  </g>

  <!-- Floating UI Elements to simulate application aesthetics -->
  <!-- Main Window -->
  <g transform="translate(860, 110)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#090a10" stroke="#ff2a70" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)"/>
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="5" fill="#ff5f56" />
    <circle cx="44" cy="24" r="5" fill="#ffbd2e" />
    <circle cx="64" cy="24" r="5" fill="#27c93f" />
    <!-- Content Lines -->
    <rect x="24" y="55" width="130" height="8" rx="4" fill="#ff2a70" opacity="0.5"/>
    <rect x="24" y="85" width="160" height="8" rx="4" fill="#8b95ad" opacity="0.2"/>
    <rect x="24" y="115" width="100" height="8" rx="4" fill="#8b95ad" opacity="0.2"/>
    <rect x="24" y="145" width="140" height="8" rx="4" fill="#8b95ad" opacity="0.2"/>
  </g>
  
  <!-- Mini overlap window -->
  <g transform="translate(790, 220)">
    <rect x="0" y="0" width="140" height="110" rx="8" fill="#111520" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" filter="url(#glow)"/>
    <rect x="15" y="25" width="40" height="6" rx="3" fill="#00e5ff" opacity="0.7"/>
    <rect x="15" y="45" width="90" height="6" rx="3" fill="#8b95ad" opacity="0.3"/>
    <rect x="15" y="65" width="70" height="6" rx="3" fill="#8b95ad" opacity="0.3"/>
  </g>

</svg>
