<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Mirrors the navbar mark: SAA over the security accent bar. Drawn on its
       own dark plate rather than transparent, so the white letterforms hold up
       against light browser chrome as well as dark. Sized to stay legible at
       16px, where any inner border or padding turns to mush. -->
  <rect width="128" height="128" rx="24" fill="#07080a"/>
  <text x="64" y="78" text-anchor="middle"
        font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="52" font-weight="800" letter-spacing="-3" fill="#f3f4f6">SAA</text>
  <rect x="26" y="94" width="76" height="12" rx="2" fill="#ff2a70"/>
</svg>
